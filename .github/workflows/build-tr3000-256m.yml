name: Build fanchmwrt · Cudy TR3000 256MB · USB Storage

on:
  workflow_dispatch:
    inputs:
      ssh_debug:
        description: '开启 SSH 调试（menuconfig 手动改配置）'
        type: boolean
        default: false

env:
  REPO_OWNER: ${{ github.repository_owner }}
  SOURCE_REPO: fanchmwrt/fanchmwrt      # ⚠️ 改成你的 fanchmwrt 源地址
  SOURCE_BRANCH: fanchmwrt-25.12.6               # ⚠️ 改成 fanchmwrt 的分支
  TARGET: mediatek/filogic
  PROFILE: cudy_tr3000-256mb-v1       # ⚠️ 确保与 .config 一致
  CONFIG_FILE: configs/tr3000-256m-usb-agd.config
  DIY_SCRIPT: diy-part2.sh

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 签出构建脚本仓库
        uses: actions/checkout@v4
        with:
          path: builder

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip \
            zlib1g-dev file wget curl cpio rsync \
            qemu-utils xz-utils

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          df -h

      - name: 签出 fanchmwrt 源码
        run: |
          git clone --depth=1 \
            https://github.com/${{ env.SOURCE_REPO }} \
            -b ${{ env.SOURCE_BRANCH }} openwrt

      - name: 更新并安装 feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 应用自定义配置（使用 olddefconfig 保护已有选项）
        run: |
          cd openwrt
          # 强制写入目标平台层级（确保不会被 defconfig 清掉）
          echo 'CONFIG_TARGET_mediatek=y' > .config
          echo 'CONFIG_TARGET_mediatek_filogic=y' >> .config
          echo 'CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-256mb-v1=y' >> .config
          # 追加你的自定义配置
          cat ${{ github.workspace }}/builder/${{ env.CONFIG_FILE }} >> .config
          # 去重
          sort -u -o .config .config
          # 执行 olddefconfig 而非 defconfig
          make olddefconfig
          # 如果 diy-part2.sh 存在，运行它
          if [ -f ${{ github.workspace }}/builder/${{ env.DIY_SCRIPT }} ]; then
            cp ${{ github.workspace }}/builder/${{ env.DIY_SCRIPT }} diy-part2.sh
            chmod +x diy-part2.sh
            ./diy-part2.sh
          fi

      - name: 校验目标设备
        working-directory: openwrt
        run: |
          grep -q 'CONFIG_TARGET_filogic=y' .config || {
            echo "::error::filogic 子目标未启用"; exit 1; }
          grep -q 'CUDY_TR3000' .config || {
            echo "::error::Cudy TR3000 profile 未命中"; exit 1; }
          make info | head -40

      - name: 预下载（多线程）
        working-directory: openwrt
        run: make download -j$(nproc)

      - name: SSH 调试（可选）
        if: ${{ inputs.ssh_debug }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: 编译固件
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: 收集产物
        id: collect
        run: |
          mkdir -p artifacts
          find openwrt/bin/targets/${{ env.TARGET }} \
            -name '*-squashfs-sysupgrade.bin' \
            -exec cp {} artifacts/ \;
          find openwrt/bin/targets/${{ env.TARGET }} \
            -name '*-factory.bin' -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -lh artifacts/
          echo "count=$(ls artifacts/*.bin 2>/dev/null | wc -l)" >> $GITHUB_OUTPUT

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tr3000-256m-firmware
          path: artifacts/*.bin
          retention-days: 14

      - name: 发 Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tr3000-256m-${{ github.run_number }}
          name: TR3000-256M fanchmwrt #${{ github.run_number }}
          body: |
            自动生成，勿手刷 128MB 设备。
            USB 存储：ext4 / exFAT / NTFS3 / block-mount / hd-idle（无 diskman UI）
            广告过滤：AdGuard Home
          files: artifacts/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
